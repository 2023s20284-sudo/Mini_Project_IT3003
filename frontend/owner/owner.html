<div class="container">
    <h1>Owner Management</h1>

    <form onsubmit="event.preventDefault(); addOwner();">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required placeholder="e.g. Jane Doe">

        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="e.g. jane@example.com">

        <label for="phone">Phone</label>
        <input type="text" id="phone" required placeholder="e.g. 0771234567">

        <label for="address">Address</label>
        <input type="text" id="address" required placeholder="e.g. Colombo">

        <button type="submit">Add Owner</button>
    </form>

    <h2>All Owners</h2>
    <div id="ownerList"></div>
</div>

<script src="../js/config.js"></script>
<script src="owner.js"></script>
</body>
</html>
