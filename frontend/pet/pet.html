<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Management - PetCare Hub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="../../index.html">Home</a>
    <a href="../owner/owner.html">Owners</a>
    <a href="../pet/pet.html">Pets</a>
    <a href="../room/room.html">Rooms</a>
    <a href="../booking/booking.html">Bookings</a>
    <a href="../care/care.html">Care Schedule</a>
    <a href="../staff/staff.html">Staff</a>
    <a href="../review/review.html">Reviews</a>
</nav>

<div class="container">
    <h1>Pet Management</h1>

    <form onsubmit="event.preventDefault(); addPet();">
        <label for="petName">Pet Name</label>
        <input type="text" id="petName" required placeholder="e.g. Buddy">

        <label for="species">Species</label>
        <select id="species" required>
            <option value="DOG">DOG</option>
            <option value="CAT">CAT</option>
            <option value="OTHER">OTHER</option>
        </select>

        <label for="breed">Breed</label>
        <input type="text" id="breed" placeholder="e.g. Golden Retriever">

        <label for="age">Age</label>
        <input type="number" id="age" required placeholder="e.g. 2">

        <label for="gender">Gender</label>
        <select id="gender" required>
            <option value="MALE">MALE</option>
            <option value="FEMALE">FEMALE</option>
        </select>

        <select id="ownerId" required>
            <option value="">-- Select an Owner --</option>
            <!-- Dynamically populated via JS -->
        </select>

        <button type="submit">Add Pet</button>


    </form>

    <h2>All Pets</h2>
    <div id="petList"></div>
</div>

<script src="../js/config.js"></script>
<script src="pet.js"></script>
</body>
</html>
