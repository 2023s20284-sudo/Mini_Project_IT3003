<div class="container">
    <h1>Staff / Sitter Management</h1>

    <form onsubmit="event.preventDefault(); addStaff();">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required placeholder="e.g. John Doe">

        <label for="role">Role</label>
        <select id="role" required>
            <option value="SITTER">SITTER</option>
            <option value="VET">VET</option>
            <option value="CLEANER">CLEANER</option>
        </select>

        <label for="contact">Contact</label>
        <input type="text" id="contact" required placeholder="e.g. 0771234567">

        <label for="shiftStart">Shift Start</label>
        <input type="time" id="shiftStart" required>

        <label for="shiftEnd">Shift End</label>
        <input type="time" id="shiftEnd" required>

        <button type="submit">Add Staff</button>
    </form>

    <h2>All Staff</h2>
    <div id="staffList"></div>
</div>

<script src="../js/config.js"></script>
<script src="staff.js"></script>
</body>
</html>
