<body>

<nav class="navbar">

<div class="container">
    <h1>Care Schedule Management</h1>

    <form onsubmit="event.preventDefault(); addCareSchedule();">
        <label for="petSelect">Select Pet</label>
        <select id="petSelect" required></select>

        <label for="staffSelect">Select Staff / Sitter</label>
        <select id="staffSelect" required></select>

        <label for="activity">Activity Description</label>
        <input type="text" id="activity" required placeholder="e.g. Feeding & Walking">

        <label for="scheduleTime">Scheduled Time</label>
        <input type="datetime-local" id="scheduleTime" required>

        <button type="submit">Add Care Schedule</button>
    </form>

    <h2>Care Schedules</h2>
    <div id="careList"></div>
</div>

<script src="../js/config.js"></script>
<script src="care.js"></script>
</body>
</html>
