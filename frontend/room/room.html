<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Management - PetCare Hub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="../../index.html">Home</a>
    <a href="../owner/owner.html">Owners</a>
    <a href="../pet/pet.html">Pets</a>
    <a href="../room/room.html">Rooms</a>
    <a href="../booking/booking.html">Bookings</a>
    <a href="../care/care.html">Care Schedule</a>
    <a href="../staff/staff.html">Staff</a>

</nav>

<div class="container">
    <h1>Room / Kennel Inventory</h1>

    <form onsubmit="event.preventDefault(); addRoom();">
        <label for="roomNumber">ROOM NUMBER</label>
        <input type="text" id="roomNumber" required placeholder="e.g. R-101">

        <label for="roomType">TYPE (SMALL / MEDIUM / LARGE)</label>
        <select id="roomType" required>
            <option value="LARGE">LARGE</option>
            <option value="MEDIUM">MEDIUM</option>
            <option value="SMALL">SMALL</option>
        </select>

        <label for="capacity">CAPACITY</label>
        <input type="number" id="capacity" required placeholder="e.g. 2">

        <label for="pricePerDay">PRICE PER DAY (RS)</label>
        <input type="number" step="0.01" id="pricePerDay" required placeholder="e.g. 1500">

        <button type="submit">Add Room</button>
    </form>

    <h2>All Rooms</h2>
    <div id="roomList"></div>
</div>

<script src="../js/config.js"></script>
<script src="room.js"></script>
</body>
</html>
