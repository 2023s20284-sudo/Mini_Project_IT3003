<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews - PetCare Hub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="../../index.html">Home</a>
    <a href="../owner/owner.html">Owners</a>
    <a href="../pet/pet.html">Pets</a>
    <a href="../room/room.html">Rooms</a>
    <a href="../booking/booking.html">Bookings</a>
    <a href="../care/care.html">Care Schedule</a>
    <a href="../staff/staff.html">Staff</a>
    <a href="../review/review.html">Reviews</a>
</nav>

<div class="container">
    <h1>Customer Reviews</h1>

    <form onsubmit="event.preventDefault(); addReview();">
        <label for="ownerSelect">Select Owner</label>
        <select id="ownerSelect" required></select>

        <label for="rating">Rating (1 to 5 Stars)</label>
        <select id="rating" required>
            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
            <option value="4">⭐⭐⭐⭐ (4/5)</option>
            <option value="3">⭐⭐⭐ (3/5)</option>
            <option value="2">⭐⭐ (2/5)</option>
            <option value="1">⭐ (1/5)</option>
        </select>

        <label for="comment">Comment / Feedback</label>
        <textarea id="comment" rows="4" required placeholder="Write your review here..."></textarea>

        <button type="submit">Submit Review</button>
    </form>

    <h2>All Reviews</h2>
    <div id="reviewList"></div>
</div>

<script src="../js/config.js"></script>
<script src="review.js"></script>
</body>
</html>
